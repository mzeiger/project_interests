<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 980" role="img" aria-labelledby="msTitle">
  <title id="msTitle">Main Project Interests screen with toolbar and project cards</title>
  <defs>
    <filter id="cardSh" x="-8%" y="-8%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.18"/>
    </filter>
    <filter id="barSh" x="-2%" y="-15%" width="104%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
    <g id="card" filter="url(#cardSh)">
      <rect width="380" height="168" rx="8" fill="#fff" stroke="#dee2e6"/>
    </g>
  </defs>
  <rect width="920" height="980" fill="#f8f9fa"/>
  <!-- Page titles (match index.php) -->
  <text x="460" y="52" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="28" font-weight="600" fill="#212529">Select Projects</text>
  <text x="460" y="86" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="18" fill="#495057">Choose the projects that interest you.</text>
  <!-- Info alert -->
  <rect x="100" y="104" width="720" height="76" rx="8" fill="#cff4fc" stroke="#9eeaf9"/>
  <text x="120" y="136" font-family="Segoe UI,system-ui,sans-serif" font-size="14" font-weight="600" fill="#055160">Click</text>
  <text x="158" y="136" font-family="Segoe UI,system-ui,sans-serif" font-size="14" font-weight="700" fill="#055160">Sign in</text>
  <text x="218" y="136" font-family="Segoe UI,system-ui,sans-serif" font-size="14" fill="#055160">and enter your email and password to load and save your interests.</text>
  <text x="120" y="158" font-family="Segoe UI,system-ui,sans-serif" font-size="14" fill="#055160">New here? Click</text>
  <rect x="248" y="142" width="72" height="22" rx="4" fill="#0d6efd"/>
  <text x="284" y="158" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="11" font-weight="600" fill="#fff">Register</text>
  <text x="330" y="158" font-family="Segoe UI,system-ui,sans-serif" font-size="14" fill="#055160">. After signing in, choose projects and click</text>
  <text x="618" y="158" font-family="Segoe UI,system-ui,sans-serif" font-size="14" font-weight="700" fill="#198754">Submit</text>
  <text x="668" y="158" font-family="Segoe UI,system-ui,sans-serif" font-size="14" fill="#055160">.</text>
  <!-- Action toolbar -->
  <rect x="60" y="200" width="800" height="72" rx="8" fill="#fff" stroke="#dee2e6" filter="url(#barSh)"/>
  <rect x="88" y="222" width="88" height="34" rx="6" fill="#0d6efd"/>
  <text x="132" y="245" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="14" font-weight="500" fill="#fff">Sign in</text>
  <rect x="200" y="222" width="88" height="34" rx="6" fill="#198754"/>
  <text x="244" y="245" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="14" font-weight="500" fill="#fff">Submit</text>
  <rect x="304" y="222" width="168" height="34" rx="6" fill="#6c757d"/>
  <text x="388" y="245" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="12" font-weight="500" fill="#fff">Go to Report&apos;s Screen</text>
  <text x="500" y="245" font-family="Segoe UI,system-ui,sans-serif" font-size="14" fill="#0d6efd" text-decoration="underline">View Instructions</text>
  <!-- Category divider -->
  <rect x="60" y="292" width="800" height="44" rx="8" fill="#e9ecef"/>
  <text x="460" y="321" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="16" font-weight="700" fill="#212529">Community Service</text>
  <!-- Row 1 cards -->
  <g transform="translate(60,352)">
    <use href="#card"/>
    <rect x="16" y="18" width="20" height="20" rx="4" fill="#fff" stroke="#333" stroke-width="2.5"/>
    <text x="48" y="34" font-family="Segoe UI,system-ui,sans-serif" font-size="15" font-weight="700" fill="#212529">Food drive</text>
    <text x="16" y="58" font-family="Segoe UI,system-ui,sans-serif" font-size="12" fill="#212529"><tspan font-weight="700">Manager:</tspan> Pat Kim</text>
    <text x="16" y="78" font-family="Segoe UI,system-ui,sans-serif" font-size="12" fill="#212529"><tspan font-weight="700">Estimated Time:</tspan> 4 hours</text>
    <text x="16" y="98" font-family="Segoe UI,system-ui,sans-serif" font-size="12" fill="#212529"><tspan font-weight="700">Description:</tspan> Collect and sort donations.</text>
    <rect x="16" y="118" width="108" height="26" rx="4" fill="#0dcaf0"/>
    <text x="70" y="136" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="11" font-weight="500" fill="#055160">Full Description</text>
  </g>
  <g transform="translate(480,352)">
    <use href="#card"/>
    <rect x="16" y="18" width="20" height="20" rx="4" fill="#0d6efd" stroke="#0d6efd" stroke-width="2"/>
    <path d="M22 28 l4 4 l8 -8" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
    <text x="48" y="34" font-family="Segoe UI,system-ui,sans-serif" font-size="15" font-weight="700" fill="#212529">Park cleanup</text>
    <text x="16" y="58" font-family="Segoe UI,system-ui,sans-serif" font-size="12" fill="#212529"><tspan font-weight="700">Manager:</tspan> Jordan Lee</text>
    <text x="16" y="78" font-family="Segoe UI,system-ui,sans-serif" font-size="12" fill="#212529"><tspan font-weight="700">Estimated Time:</tspan> 3 hours</text>
    <text x="16" y="98" font-family="Segoe UI,system-ui,sans-serif" font-size="12" fill="#212529"><tspan font-weight="700">Description:</tspan> Trash pickup and recycling.</text>
  </g>
  <!-- Row 2 -->
  <g transform="translate(60,540)">
    <use href="#card"/>
    <rect x="16" y="18" width="20" height="20" rx="4" fill="#fff" stroke="#333" stroke-width="2.5"/>
    <text x="48" y="34" font-family="Segoe UI,system-ui,sans-serif" font-size="15" font-weight="700" fill="#212529">Scholarship committee</text>
    <text x="16" y="58" font-family="Segoe UI,system-ui,sans-serif" font-size="12" fill="#212529"><tspan font-weight="700">Manager:</tspan> Alex Rivera</text>
    <text x="16" y="78" font-family="Segoe UI,system-ui,sans-serif" font-size="12" fill="#212529"><tspan font-weight="700">Estimated Time:</tspan> 10 hours</text>
    <text x="16" y="98" font-family="Segoe UI,system-ui,sans-serif" font-size="12" fill="#212529"><tspan font-weight="700">Description:</tspan> Review applications.</text>
  </g>
  <g transform="translate(480,540)">
    <use href="#card"/>
    <rect x="16" y="18" width="20" height="20" rx="4" fill="#0d6efd" stroke="#0d6efd" stroke-width="2"/>
    <path d="M22 28 l4 4 l8 -8" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
    <text x="48" y="34" font-family="Segoe UI,system-ui,sans-serif" font-size="15" font-weight="700" fill="#212529">Youth programs</text>
    <text x="16" y="58" font-family="Segoe UI,system-ui,sans-serif" font-size="12" fill="#212529"><tspan font-weight="700">Manager:</tspan> Sam Ortiz</text>
    <text x="16" y="78" font-family="Segoe UI,system-ui,sans-serif" font-size="12" fill="#212529"><tspan font-weight="700">Estimated Time:</tspan> 6 hours</text>
    <text x="16" y="98" font-family="Segoe UI,system-ui,sans-serif" font-size="12" fill="#212529"><tspan font-weight="700">Description:</tspan> Support club youth events.</text>
    <rect x="16" y="118" width="108" height="26" rx="4" fill="#0dcaf0"/>
    <text x="70" y="136" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="11" font-weight="500" fill="#055160">Full Description</text>
  </g>
  <text x="460" y="760" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="13" fill="#6c757d">Sample layout; your club&apos;s project names and details will differ.</text>
</svg>
