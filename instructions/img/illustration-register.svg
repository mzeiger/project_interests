<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="t3">
  <title id="t3">Register dialog</title>
  <rect width="720" height="520" fill="rgba(0,0,0,0.35)"/>
  <rect x="80" y="40" width="560" height="440" rx="12" fill="#fff" filter="url(#sd2)"/>
  <defs>
    <filter id="sd2" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.18"/>
    </filter>
  </defs>
  <text x="360" y="80" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="20" font-weight="600" fill="#212529">Register</text>
  <g font-family="Segoe UI,system-ui,sans-serif" font-size="12" fill="#495057">
    <text x="110" y="118">Email</text>
    <rect x="200" y="104" width="400" height="28" rx="4" fill="#fff" stroke="#ced4da"/>
    <text x="110" y="158">First name</text>
    <rect x="200" y="144" width="400" height="28" rx="4" fill="#fff" stroke="#ced4da"/>
    <text x="110" y="198">Last name</text>
    <rect x="200" y="184" width="400" height="28" rx="4" fill="#fff" stroke="#ced4da"/>
    <text x="110" y="238">Password</text>
    <rect x="200" y="224" width="360" height="28" rx="4" fill="#fff" stroke="#ced4da"/>
    <circle cx="582" cy="238" r="10" fill="none" stroke="#6c757d"/>
    <text x="110" y="278">Confirm</text>
    <rect x="200" y="264" width="360" height="28" rx="4" fill="#fff" stroke="#ced4da"/>
    <circle cx="582" cy="278" r="10" fill="none" stroke="#6c757d"/>
  </g>
  <text x="360" y="330" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="11" fill="#6c757d">Password must be at least 8 characters. Use the eye icon to show or hide.</text>
  <rect x="200" y="360" width="100" height="34" rx="6" fill="#6c757d"/>
  <text x="250" y="382" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="14" fill="#fff">Cancel</text>
  <rect x="460" y="360" width="140" height="34" rx="6" fill="#0d6efd"/>
  <text x="530" y="382" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="14" fill="#fff">Submit</text>
</svg>
