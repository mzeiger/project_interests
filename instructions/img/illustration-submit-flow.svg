<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" role="img" aria-labelledby="t5">
  <title id="t5">Sign in then submit workflow</title>
  <rect width="900" height="200" fill="#f8f9fa"/>
  <g font-family="Segoe UI,system-ui,sans-serif">
    <rect x="40" y="70" width="160" height="64" rx="10" fill="#e7f1ff" stroke="#0d6efd" stroke-width="2"/>
    <text x="120" y="100" text-anchor="middle" font-size="13" font-weight="600" fill="#0d6efd">1. Sign in</text>
    <text x="120" y="120" text-anchor="middle" font-size="11" fill="#495057">Email + password</text>
    <path d="M220 102 L280 102" stroke="#6c757d" stroke-width="2" marker-end="url(#arr)"/>
    <rect x="300" y="70" width="200" height="64" rx="10" fill="#fff" stroke="#dee2e6" stroke-width="2"/>
    <text x="400" y="100" text-anchor="middle" font-size="13" font-weight="600" fill="#212529">2. Check projects</text>
    <text x="400" y="120" text-anchor="middle" font-size="11" fill="#495057">Select all that apply</text>
    <path d="M520 102 L580 102" stroke="#6c757d" stroke-width="2" marker-end="url(#arr)"/>
    <rect x="600" y="70" width="160" height="64" rx="10" fill="#d1e7dd" stroke="#198754" stroke-width="2"/>
    <text x="680" y="100" text-anchor="middle" font-size="13" font-weight="600" fill="#198754">3. Submit</text>
    <text x="680" y="120" text-anchor="middle" font-size="11" fill="#495057">Saves your interests</text>
  </g>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#6c757d"/>
    </marker>
  </defs>
  <text x="450" y="40" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="15" font-weight="600" fill="#212529">Typical workflow</text>
</svg>
