<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" role="img" aria-labelledby="t4">
  <title id="t4">Forgot password dialog</title>
  <rect width="560" height="400" fill="rgba(0,0,0,0.35)"/>
  <rect x="80" y="70" width="400" height="260" rx="12" fill="#fff" filter="url(#sd3)"/>
  <defs>
    <filter id="sd3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-opacity="0.2"/>
    </filter>
  </defs>
  <text x="280" y="110" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="18" font-weight="600" fill="#212529">Forgot password</text>
  <text x="280" y="150" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="12" fill="#6c757d">Enter your account email. If registered, you will receive</text>
  <text x="280" y="168" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="12" fill="#6c757d">reset instructions (usually by email).</text>
  <text x="110" y="210" font-family="Segoe UI,system-ui,sans-serif" font-size="12" fill="#495057">Email</text>
  <rect x="110" y="218" width="340" height="32" rx="6" fill="#fff" stroke="#ced4da"/>
  <rect x="110" y="280" width="100" height="34" rx="6" fill="#6c757d"/>
  <text x="160" y="302" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="13" fill="#fff">Cancel</text>
  <rect x="230" y="280" width="160" height="34" rx="6" fill="#0d6efd"/>
  <text x="310" y="302" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="13" fill="#fff">Send reset link</text>
</svg>
