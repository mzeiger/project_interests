<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" role="img" aria-labelledby="t1">
  <title id="t1">Project Interests main page overview</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8f9fa"/>
      <stop offset="100%" stop-color="#e9ecef"/>
    </linearGradient>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="880" height="420" fill="url(#bg)"/>
  <rect x="40" y="24" width="800" height="48" rx="8" fill="#fff" filter="url(#sh)"/>
  <text x="440" y="56" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="22" font-weight="600" fill="#212529">Select Projects</text>
  <text x="440" y="86" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="14" fill="#6c757d">Choose the projects that interest you</text>
  <rect x="40" y="108" width="800" height="56" rx="8" fill="#cff4fc" stroke="#9eeaf9"/>
  <text x="60" y="142" font-family="Segoe UI,system-ui,sans-serif" font-size="13" fill="#055160">Sign in with your email and password, or Register if you are new. Then use Submit.</text>
  <rect x="40" y="180" width="800" height="64" rx="8" fill="#fff" stroke="#dee2e6" filter="url(#sh)"/>
  <rect x="60" y="198" width="88" height="32" rx="6" fill="#0d6efd"/>
  <text x="104" y="219" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="13" fill="#fff">Sign in</text>
  <rect x="170" y="198" width="88" height="32" rx="6" fill="#198754"/>
  <text x="214" y="219" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="13" fill="#fff">Submit</text>
  <rect x="278" y="198" width="140" height="32" rx="6" fill="#6c757d"/>
  <text x="348" y="219" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="12" fill="#fff">Go to Reports</text>
  <text x="450" y="219" font-family="Segoe UI,system-ui,sans-serif" font-size="13" fill="#0d6efd">View Instructions</text>
  <rect x="40" y="260" width="380" height="140" rx="8" fill="#fff" stroke="#dee2e6" filter="url(#sh)"/>
  <rect x="56" y="280" width="18" height="18" rx="3" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="84" y="294" font-family="Segoe UI,system-ui,sans-serif" font-size="14" fill="#212529">Sample project A</text>
  <text x="56" y="318" font-family="Segoe UI,system-ui,sans-serif" font-size="11" fill="#6c757d">Manager, Time, Description</text>
  <rect x="460" y="260" width="380" height="140" rx="8" fill="#fff" stroke="#dee2e6" filter="url(#sh)"/>
  <rect x="476" y="280" width="18" height="18" rx="3" fill="#0d6efd" stroke="#0d6efd"/>
  <path d="M480 288 l5 5 l10 -10" fill="none" stroke="#fff" stroke-width="2"/>
  <text x="504" y="294" font-family="Segoe UI,system-ui,sans-serif" font-size="14" fill="#212529">Sample project B</text>
  <text x="476" y="318" font-family="Segoe UI,system-ui,sans-serif" font-size="11" fill="#6c757d">Check boxes for projects you want</text>
</svg>
