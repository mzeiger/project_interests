<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="t2">
  <title id="t2">Sign in dialog</title>
  <defs>
    <filter id="sd" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="640" height="480" fill="rgba(0,0,0,0.35)"/>
  <rect x="120" y="60" width="400" height="360" rx="12" fill="#fff" filter="url(#sd)"/>
  <text x="320" y="100" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="20" font-weight="600" fill="#212529">Sign in</text>
  <text x="160" y="150" font-family="Segoe UI,system-ui,sans-serif" font-size="13" fill="#495057">Email</text>
  <rect x="160" y="158" width="320" height="36" rx="6" fill="#fff" stroke="#ced4da"/>
  <text x="172" y="182" font-family="Segoe UI,system-ui,sans-serif" font-size="14" fill="#adb5bd">you@example.com</text>
  <text x="160" y="228" font-family="Segoe UI,system-ui,sans-serif" font-size="13" fill="#495057">Password</text>
  <rect x="160" y="236" width="280" height="36" rx="6" fill="#fff" stroke="#ced4da"/>
  <text x="172" y="260" font-family="Segoe UI,system-ui,sans-serif" font-size="14" fill="#adb5bd">&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;</text>
  <circle cx="448" cy="254" r="14" fill="none" stroke="#6c757d" stroke-width="2"/>
  <circle cx="448" cy="254" r="4" fill="#6c757d"/>
  <text x="320" y="310" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="12" fill="#0d6efd">Forgot password?</text>
  <rect x="160" y="340" width="100" height="36" rx="6" fill="#6c757d"/>
  <text x="210" y="364" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="14" fill="#fff">Cancel</text>
  <rect x="380" y="340" width="100" height="36" rx="6" fill="#0d6efd"/>
  <text x="430" y="364" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="14" fill="#fff">Sign in</text>
</svg>
